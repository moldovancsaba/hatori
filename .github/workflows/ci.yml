name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r ui/requirements.txt

      - name: Start DB container (CI-safe)
        run: make up-ci

      - name: Reset DB
        run: make reset

      - name: Run test suite (self_test + dod_gate + golden)
        run: make test

      - name: Cleanup
        if: always()
        run: make down-ci
